version: "3.9"

name: nodo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nodo-backend
    container_name: nodo-backend
    restart: unless-stopped
    env_file: .env
    command: ["sh","-lc","mkdir -p /app/logs && pip install -r requirements.txt && python manage.py migrate --no-input && python manage.py collectstatic --no-input --clear && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120 --access-logfile - --error-logfile -"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nodo-frontend
    container_name: nodo-frontend
    restart: unless-stopped
    env_file: .env
    command: ["sh","-lc","npm ci && npm run build && npm run start -- -p 3000 -H 0.0.0.0"]
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  redis:
    image: redis:7-alpine
    container_name: nodo-redis
    restart: unless-stopped
    command: ["redis-server","--maxmemory","256mb","--maxmemory-policy","allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  static_volume:
  media_volume:
  logs_volume:
  redis_data:
